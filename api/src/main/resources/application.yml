
spring:
  jackson:
    deserialization:
      accept-single-value-as-array: true
  application:
    name: api
  datasource:
    url: jdbc:mysql://localhost:3306/api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        security:
          enabled: false

  logging:
    level:
      org:
        springframework:
          security: DEBUG

server:
  port: 33333

eureka:
  client:
    enabled: false
  instance:
    instance-id: ${spring.application.name}:${random.int}
